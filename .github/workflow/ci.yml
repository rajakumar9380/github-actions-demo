name: My First GitHub Action

on:
  push:
    branches:
      - main

jobs:
  hello:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Message
        run: echo "Hello DevOps!"

      - name: Show Current Directory
        run: pwd

      - name: List Files
        run: ls -la
